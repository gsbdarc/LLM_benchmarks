[pytest]
# Tells pytest HOW to run this package's tests (not test code itself).
#   testpaths     -> bare `pytest` from agent_eval/ only collects tests/
#   asyncio_mode  -> lets us write `async def test_...` without @mark.asyncio
#                    (without it, async tests are silently skipped)
#   addopts -q    -> quieter output
testpaths = tests
asyncio_mode = auto
addopts = -q
